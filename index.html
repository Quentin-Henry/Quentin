<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quentin Henry</title>
  <meta name="description" content="Quentin Henry — graphic designer and creative technologist in New York." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preload" href="scan.bin" as="fetch" crossorigin />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="canonical" href="https://quentinhenry.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://quentinhenry.com/" />
  <meta property="og:title" content="Quentin Henry" />
  <meta property="og:description" content="Graphic designer and creative technologist in New York." />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #37352F;
      --secondary: #9B9A97;
      --tertiary: #C4C4C0;
      --hover: #EFEFED;
      --border: #E8E8E6;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --pad: clamp(16px, 2.2vw, 28px);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    /* iOS Safari only draws page content under its floating toolbar when that
       content is really part of the page (not clipped by overflow:hidden on the
       root, not position:fixed). So the canvas sits in the page and, on touch
       devices, overshoots the bottom of the screen to cover the whole toolbar and
       home-indicator strip. The page is then taller than the screen, so scrolling
       is blocked in JS (see SCROLL LOCK) rather than with overflow:hidden. */
    html { background: var(--bg); overscroll-behavior: none; }
    body { min-height: 100vh; min-height: 100lvh; overflow-x: hidden; position: relative; background: var(--bg); overscroll-behavior: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .ext { text-decoration: underline; text-decoration-color: var(--tertiary); text-underline-offset: 2px; transition: text-decoration-color 0.15s; }
    .ext:hover { text-decoration-color: currentColor; }
    .ext span { font-size: 0.9em; }

    /* The face is the page: one canvas behind everything, bleeding off the edges.
       Where it sits is set in JS (COMPOSITION), the text just floats over it. */
    /* 100lvh = the tallest the viewport gets, i.e. including the area under Safari's
       floating address/tab bar, so the face runs behind the bar instead of stopping
       above it. (Falls back to 100vh in older browsers.) */
    #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; display: block; z-index: 0; }
    @media (pointer: coarse) {
      #stage { height: calc(100lvh + env(safe-area-inset-bottom) + 80px); }
    }
    /* Long-presses are an easter egg here, so no iOS magnifier / text-selection callout */
    body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .text { -webkit-user-select: text; user-select: text; }

    .sheet {
      position: relative; z-index: 1;
      height: 100svh;
      display: grid;
      grid-template-columns: 56fr 44fr;
      grid-template-rows: auto 1fr;
      column-gap: var(--pad);
      padding: var(--pad);
      padding-top: max(var(--pad), env(safe-area-inset-top));
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      pointer-events: none;
    }
    .sheet a, .sheet button { pointer-events: auto; }
    .sheet > * { min-width: 0; }
    .muted { color: var(--secondary); }
    .who { grid-column: 1; grid-row: 1; }
    .status { grid-column: 2; grid-row: 1; align-self: start; }
    /* ── "LIVE" STATUS ── a soft light passes across the words every few seconds, so
       the line feels like something running, not a label. The light is paler than
       the text grey, so nothing ever gets darker than the words themselves. */
    :root { --live-beat: 3.2s; --sheen: #DCDBD8; }
    .live-text {
      /* Text painted with a wide gradient; a pale band in the middle sweeps left→right */
      background: linear-gradient(100deg,
        var(--secondary) 0%, var(--secondary) 42%,
        var(--sheen) 50%,
        var(--secondary) 58%, var(--secondary) 100%);
      background-size: 250% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: sheen var(--live-beat) ease-in-out infinite;
    }
    @keyframes sheen {
      0% { background-position: 100% 0; }   /* band just off the left edge */
      65%, 100% { background-position: 0% 0; } /* passes through, then rests off the right */
    }
    @media (prefers-reduced-motion: reduce) {
      .live-text { animation: none; }
      .live-text { background: none; color: inherit; }
    }
    .text {
      grid-column: 2; grid-row: 2;
      margin-top: clamp(40px, 8vh, 88px);
      max-width: 380px;
      display: grid; gap: 1.45em; align-content: start;
    }
    /* Icon-only contact row, same 1.6 stroke as the WIP site's icons */
    .links { display: flex; gap: 6px; margin-left: -6px; }
    .links a {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 6px;
      color: var(--text);
      transition: background 0.12s, color 0.12s;
    }
    .links a:hover { background: var(--hover); }
    .links a:focus-visible { outline: 1px dashed var(--secondary); outline-offset: 1px; }
    .links svg {
      width: 18px; height: 18px;
      fill: none; stroke: currentColor;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }

    .loading {
      position: fixed; left: var(--pad); bottom: calc(var(--pad) + env(safe-area-inset-bottom)); z-index: 1;
      font-family: var(--mono); font-size: 11px; color: var(--secondary);
      transition: opacity 0.4s;
    }
    .loading.done { opacity: 0; visibility: hidden; transition: opacity 0.4s, visibility 0s 0.4s; }

    /* Phone: text stacked at the top, face fills the rest and runs off the bottom */
    @media (max-width: 720px) {
      .sheet { grid-template-columns: 1fr auto; grid-template-rows: auto; align-content: start; padding: max(36px, calc(env(safe-area-inset-top) + 16px)) max(28px, env(safe-area-inset-right)) 0 max(28px, env(safe-area-inset-left)); }
      /* Everything left-aligned. The status is an eyebrow on the bio: the big gap is
         between the name and this group, a small one between eyebrow and bio. */
      .who { grid-column: 1 / -1; grid-row: 1; }
      .status { grid-column: 1 / -1; grid-row: 2; margin-top: 40px; font-size: 12px; }
      .text { grid-column: 1 / -1; grid-row: 3; }
      .text { margin-top: 8px; font-size: 13px; line-height: 1.55; gap: 20px; }
    }
  </style>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="A 3D scan of Quentin's face that turns to follow the cursor" role="img"></canvas>

  <main class="sheet">
    <div class="who">Quentin Henry<br><span class="muted">Design &amp; code, New York</span></div>
    <div class="status muted"><span class="live-text">New site in progress</span></div>
    <section class="text">
      <p>Graphic designer and creative technologist working across identity systems, digital products and generative design tools. Currently a designer at <a class="ext" href="https://www.lippincott.com" target="_blank" rel="noopener">Lippincott&nbsp;<span aria-hidden="true">&nearr;</span></a>.</p>
      <nav class="links" aria-label="Contact">
        <a href="mailto:q@quentinhenry.com" aria-label="Email q@quentinhenry.com" title="q@quentinhenry.com">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
        </a>
        <a href="https://www.instagram.com/q.uen.ti.n/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/quentinhenry1/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M8 10.5v6M8 7.6v.01M11.5 16.5v-6M11.5 13.2c0-1.6 1-2.7 2.4-2.7s2.1 1 2.1 2.6v3.4"/></svg>
        </a>
      </nav>
    </section>
  </main>

  <div class="loading" id="loading">loading scan</div>


  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // ── THE LOOK ── mode: 0 photo, 1 threshold, 2 dither, 3 mesh · color: 0 B&W, 1 colour
    const DEFAULTS = { mode: 0, color: 0, facet: 2 };
    // ── PIXELATION ── how many pixel blocks fit down the scan's height (head + shoulders).
    // It follows the head's size on screen, so the face breaks up the same way on every
    // screen. Lower = chunkier. Desktop 130 ≈ the old 12px at 1440×900.
    // minPx/maxPx stop the blocks getting too fine or too coarse in absolute pixels.
    const GRAIN = { desktop: 130, mobile: 125, minPx: 6, maxPx: 28 };
    // Click anywhere: facet jumps to max, holds, then eases back to DEFAULTS.facet
    // slow at first and snapping in at the end (ease-in).
    const SHATTER = { peak: 100, hold: 500, duration: 1400 };

    // ── COMPOSITION ── where the head sits, as fractions of the viewport.
    // x/y: head centre. h: head height relative to viewport height (>1 bleeds off).
    const COMPOSITION = {
      desktop: { x: 0.24, y: 0.93, h: 1.75 },
      mobile:  { x: 0.45, y: 1.02, h: 1.5 },
    };

    const canvas = document.getElementById('stage');
    const loadingEl = document.getElementById('loading');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = () => innerWidth <= 720;
    // Size of the drawing area (taller than innerHeight on iOS, see #stage CSS)
    // Composition is measured against the screen (body is 100lvh tall). The canvas can
    // be taller than that on phones (it overshoots under Safari's toolbar).
    const stageSize = () => ({ w: canvas.clientWidth || innerWidth, h: document.body.clientHeight || innerHeight });

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    } catch (err) {
      // No WebGL (very old device, or disabled): leave the text-only card
      canvas.remove(); loadingEl.remove();
      throw err;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    // The face is drawn in 6px+ blocks, so the offscreen pass only needs CSS-pixel
    // resolution and no antialiasing: much lighter on phones, looks identical.
    const rt = new THREE.WebGLRenderTarget(1, 1, { samples: 0 });
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(18, 1, 0.1, 100);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.4));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-1.5, 2, 2.5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 0.8);
    rim.position.set(2, 1, -1.5);
    scene.add(rim);

    const pivot = new THREE.Group();
    scene.add(pivot);

    const post = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: rt.texture },
        uRes: { value: new THREE.Vector2(1, 1) },
        uMode: { value: 0 },
        uColor: { value: 0 },
        uPix: { value: 1 },
        uTime: { value: 0 },
        uInk: { value: new THREE.Color('#37352F') },
        uPaper: { value: new THREE.Color('#FFFFFF') },
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
      fragmentShader: `
        precision highp float;
        uniform sampler2D tScene; uniform vec2 uRes; uniform float uMode, uPix, uTime, uColor;
        uniform vec3 uInk, uPaper;
        varying vec2 vUv;
        float bayer4(vec2 p){
          int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
          int i = x + y * 4;
          float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
          for (int k = 0; k < 16; k++) if (k == i) return (m[k] + .5) / 16.;
          return .5;
        }
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        void main(){
          vec2 px = vUv * uRes;
          // Cells are anchored to the top-left so the grid lines up with the page edge
          vec2 fromTop = vec2(px.x, uRes.y - px.y);
          vec2 cell = floor(fromTop / uPix);
          vec2 sampleTop = (cell + .5) * uPix;
          vec2 uv = vec2(sampleTop.x, uRes.y - sampleTop.y) / uRes;
          vec4 s = texture2D(tScene, uv);
          vec3 c = pow(max(s.rgb, 0.), vec3(1. / 2.2));
          float l = dot(c, vec3(.299, .587, .114));
          float a = step(.5, s.a);
          vec3 col;
          if (uMode < .5) {
            float g = (hash(cell + floor(uTime * 8.)) - .5) * .05;
            if (uColor > .5) {
              // Colour: same contrast curve per channel, a touch of extra saturation
              vec3 cc = smoothstep(vec3(.06), vec3(.92), c);
              float cl = dot(cc, vec3(.299, .587, .114));
              cc = mix(vec3(cl), cc, 1.15) + g;
              col = mix(vec3(.08), vec3(1.), clamp(cc, 0., 1.));
            } else {
              l = smoothstep(.06, .92, l) + g;
              col = mix(vec3(.08), vec3(1.), clamp(l, 0., 1.));
            }
          } else if (uMode < 1.5) {
            col = mix(uInk, uPaper, step(.42, l));
          } else if (uMode < 2.5) {
            l = smoothstep(.05, .9, l);
            col = mix(uInk, uPaper, step(bayer4(cell), l));
          } else {
            gl_FragColor = vec4(mix(uPaper, uInk, s.a), 1.); return;
          }
          gl_FragColor = vec4(mix(uPaper, col, a), 1.);
        }`,
      depthTest: false, depthWrite: false,
    });
    const postScene = new THREE.Scene();
    const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));

    // ── FACET ── snaps vertices to a 3D grid in the vertex shader
    const facetU = { value: 0 };
    const patchFacet = (mat) => {
      mat.onBeforeCompile = (sh) => {
        sh.uniforms.uFacet = facetU;
        sh.vertexShader = 'uniform float uFacet;\n' + sh.vertexShader.replace(
          '#include <begin_vertex>',
          `#include <begin_vertex>
           if (uFacet > 0.) transformed = floor(transformed / uFacet + .5) * uFacet;`
        );
      };
    };
    const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.55 });
    patchFacet(wireMat);

    // ── STATE ──
    const state = { mode: DEFAULTS.mode, color: DEFAULTS.color, facet: DEFAULTS.facet };
    // Block size in CSS px for a head that is placementH × viewport tall
    const grainFor = (placementH) => {
      const blocks = isMobile() ? GRAIN.mobile : GRAIN.desktop;
      const px = Math.round((placementH * stageSize().h) / blocks);
      return Math.min(GRAIN.maxPx, Math.max(GRAIN.minPx, px));
    };

    let headSize = new THREE.Vector3(1, 1, 1);
    let faceMesh = null, faceMat = null, currentRoot = null;

    function applyFacet() {
      const v = state.facet / 100;
      facetU.value = v === 0 ? 0 : (v * v) * headSize.y * 0.12 + headSize.y * 0.004;
      if (faceMat) {
        const flat = v > 0;
        if (faceMat.flatShading !== flat) { faceMat.flatShading = flat; faceMat.needsUpdate = true; }
      }
    }

    // ── LOAD / SWAP SCAN ──
    const loader = new GLTFLoader();
    // Decoder for Draco-compressed meshes, same three.js version as the loader
    loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/'));
    const cache = {};
    function loadScan(file) {
      loadingEl.classList.remove('done');
      loadingEl.textContent = 'loading scan';
      const done = (root) => {
        if (currentRoot) pivot.remove(currentRoot);
        currentRoot = root;
        root.traverse((o) => { if (o.isMesh) faceMesh = o; });
        faceMat = faceMesh.userData.faceMat;
        measureHead(faceMesh);
        const box = new THREE.Box3().setFromObject(root);
        headSize = box.getSize(new THREE.Vector3());
        pivot.add(root);
        applyFacet();
        layout();
        loadingEl.classList.add('done');
        setTimeout(() => loadingEl.remove(), 600); // don't rely on the CSS transition finishing
      };
      if (cache[file]) return done(cache[file]);
      fetchScan(file).then((buf) => loader.parse(buf, './', (gltf) => {
        const root = new THREE.Group();
        const inner = gltf.scene;
        let mesh;
        inner.traverse((o) => { if (o.isMesh) mesh = o; });
        mesh.geometry.computeVertexNormals();
        const mat = mesh.material;
        mat.flatShading = false;
        mat.roughness = 0.75;
        patchFacet(mat);
        mesh.userData.faceMat = mat;
        // Centre on the pivot so it turns around its own middle
        const box = new THREE.Box3().setFromObject(inner);
        inner.position.sub(box.getCenter(new THREE.Vector3()));
        root.add(inner);
        cache[file] = root;
        done(root);
      }, fail)).catch(fail);
    }
    function fail() { loadingEl.textContent = 'scan unavailable'; }

    // The scan ships scrambled (see _tools/scramble_scan.py) so it isn't a plain .glb
    // anyone can save from the Network tab and open. Key must match that script.
    const SCAN_KEY = '9e3779b97f4a7c15f39cc0605cedc8341082276bf3a27251f86c6a11d0c18e95'
      .match(/../g).map((h) => parseInt(h, 16));
    async function fetchScan(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const total = +res.headers.get('content-length') || 0;
      const reader = res.body.getReader();
      const parts = []; let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (total) loadingEl.textContent = 'loading scan ' + Math.round(got / total * 100) + '%';
      }
      const out = new Uint8Array(got);
      let o = 0;
      for (const p of parts) { out.set(p, o); o += p.length; }
      for (let i = 0; i < out.length; i++) out[i] ^= SCAN_KEY[i % 32] ^ ((i * 31) & 0xFF);
      return out.buffer;
    }

    // ── PLACEMENT ── nothing is cropped: the canvas covers the whole page and the head
    // is moved/scaled so it stays clear of the text instead.
    // Desktop: the head's right edge stays left of the text column. If there isn't room,
    //   it first slides further off the left edge (up to 30% of the head), then shrinks.
    // Phone: the top of the hair stays below the text.
    let headWidthRatio = 0.4; // head (not shoulders) width ÷ bbox height, measured on load
    function measureHead(mesh) {
      const g = mesh.geometry;
      if (!g.boundingBox) g.computeBoundingBox();
      const bb = g.boundingBox, pos = g.attributes.position;
      const cut = bb.min.y + (bb.max.y - bb.min.y) * 0.5; // upper half = hair + face
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < pos.count; i++) {
        if (pos.getY(i) < cut) continue;
        const x = pos.getX(i);
        if (x < lo) lo = x;
        if (x > hi) hi = x;
      }
      if (hi > lo) headWidthRatio = (hi - lo) / (bb.max.y - bb.min.y);
    }
    function placement() {
      const { w: W, h: H } = stageSize();
      const c = isMobile() ? COMPOSITION.mobile : COMPOSITION.desktop;
      const pad = parseFloat(getComputedStyle(document.querySelector('.sheet')).paddingLeft) || 16;
      const top = c.y - c.h / 2; // keep the top of the head where the composition puts it
      let h = c.h;
      if (!isMobile()) {
        const right = document.querySelector('.status').getBoundingClientRect().left - pad;
        let headW = headWidthRatio * h * H * 1.06; // a little slack for the head turning
        let cx = Math.min(c.x * W, right - headW / 2);
        if (cx < headW * 0.2) {
          headW = right / 0.7;
          h = headW / (headWidthRatio * H * 1.06);
          cx = headW * 0.2;
        }
        return { x: cx / W, y: top + h / 2, h };
      }
      const textBottom = document.querySelector('.text').getBoundingClientRect().bottom / H;
      const minTop = textBottom + (pad * 2) / H;
      return { x: c.x, y: Math.max(top, minTop) + h / 2, h };
    }

    // ── LAYOUT ── size the camera so the head is h × viewport tall, then shift the
    // view so its centre lands at (x, y) on screen. Off-centre without skewing the face.
    function layout() {
      const { w, h } = stageSize();          // screen: what the composition is relative to
      const hc = canvas.clientHeight || h;   // canvas: may run further down (under the toolbar)
      const dpr = renderer.getPixelRatio();
      renderer.setSize(w, hc, false);
      rt.setSize(w, hc);
      post.uniforms.uRes.value.set(w * dpr, hc * dpr);
      const c = placement();
      post.uniforms.uPix.value = grainFor(c.h) * dpr;
      const visibleH = (headSize.y / c.h) * (hc / h);
      const dist = visibleH / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      camera.position.set(0, 0, dist + headSize.z / 2);
      camera.lookAt(0, 0, 0);
      camera.aspect = w / hc;
      camera.setViewOffset(w, hc, w / 2 - c.x * w, hc / 2 - c.y * h, w, hc);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', layout);

    // ── SCROLL LOCK ── on phones the page is taller than the screen (so the face can
    // run under Safari's toolbar) but it should never scroll. Two-finger pinch-zoom
    // is left alone for accessibility.
    addEventListener('touchmove', (e) => { if (e.touches.length === 1) e.preventDefault(); }, { passive: false });
    addEventListener('scroll', () => { if (scrollY || scrollX) scrollTo(0, 0); }, { passive: true });
    new ResizeObserver(() => layout()).observe(canvas); // e.g. lvh settling on iOS

    // ── LOOK AT THE CURSOR ──
    const target = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
    let lastMove = -1e9;
    function aim(clientX, clientY) {
      const c = placement();
      // Measured from the eyes (a bit above head centre), not the canvas centre
      const { w: W, h: H } = stageSize();
      const ex = c.x * W, ey = (c.y - c.h * 0.08) * H;
      target.x = THREE.MathUtils.clamp((clientX - ex) / (W * 0.5), -1.2, 1.2);
      target.y = THREE.MathUtils.clamp((clientY - ey) / (H * 0.5), -1.2, 1.2);
      lastMove = performance.now();
    }
    addEventListener('pointermove', (e) => aim(e.clientX, e.clientY), { passive: true });
    addEventListener('pointerdown', (e) => aim(e.clientX, e.clientY), { passive: true });

    // ── LOOP ──
    const clock = new THREE.Clock();
    function frameLoop() {
      const t = clock.getElapsedTime();
      const idle = performance.now() - lastMove > 2500;
      const tx = idle && !reduceMotion ? Math.sin(t * 0.35) * 0.35 : target.x;
      const ty = idle && !reduceMotion ? Math.sin(t * 0.23) * 0.12 : target.y;
      const k = reduceMotion ? 1 : 0.06;
      cur.x += (tx - cur.x) * k;
      cur.y += (ty - cur.y) * k;
      pivot.rotation.y = cur.x * 0.6;
      pivot.rotation.x = cur.y * 0.3;

      post.uniforms.uTime.value = t;
      post.uniforms.uMode.value = state.mode;
      post.uniforms.uColor.value = state.color;
      if (faceMesh) faceMesh.material = state.mode === 3 ? wireMat : faceMat;
      renderer.setRenderTarget(rt);
      renderer.setClearColor(0x000000, 0);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCam);
      requestAnimationFrame(frameLoop);
    }

    loadScan('scan.bin'); // shoulders scan, Draco-compressed + scrambled

    // ── SHATTER ON CLICK ── jump to max facet, then ease back over SHATTER.duration.
    // Clicking again mid-animation restarts it from the top.
    let shatterStart = null;
    const easeInCubic = (t) => t * t * t;
    function shatterTick(now) {
      const t = Math.min(Math.max(now - shatterStart - SHATTER.hold, 0) / SHATTER.duration, 1);
      state.facet = SHATTER.peak + (DEFAULTS.facet - SHATTER.peak) * easeInCubic(t);
      applyFacet();
      if (t < 1) requestAnimationFrame(shatterTick);
      else shatterStart = null;
    }
    function shatter() {
      if (reduceMotion) return;
      const running = shatterStart !== null;
      shatterStart = performance.now();
      if (!running) requestAnimationFrame(shatterTick);
    }
    let suppressClick = false; // the click that ends a long-press shouldn't also shatter
    addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return; // links keep working normally
      if (suppressClick) { suppressClick = false; return; }
      shatter();
    });

    // ── PHONE MOTION ── tilt the phone to turn the head; shake it to shatter.
    // Android delivers these with no prompt. iOS needs permission, which we never ask
    // for up front (a system dialog is jarring). The easter egg: long-press anywhere
    // for ~1s and iOS asks; once allowed, tilt and shake work like on Android.
    const TILT = { range: 25, recentre: 0.02 }; // degrees for a full turn · how fast "level" follows your grip
    const SHAKE = { threshold: 18, cooldown: 1200 }; // m/s² of jolt · ms between shakes
    let base = null, lastShake = 0, motionOn = false;

    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return; // desktops fire empty events
      motionOn = true;
      // Whatever angle you hold the phone at becomes "looking straight ahead",
      // and that neutral point slowly follows your grip so it never gets stuck.
      if (!base) base = { b: e.beta, g: e.gamma };
      base.b += (e.beta - base.b) * TILT.recentre;
      base.g += (e.gamma - base.g) * TILT.recentre;
      target.x = THREE.MathUtils.clamp((e.gamma - base.g) / TILT.range, -1.2, 1.2);
      target.y = THREE.MathUtils.clamp((e.beta - base.b) / TILT.range, -1.2, 1.2);
      lastMove = performance.now();
    }
    function onMotion(e) {
      const a = e.acceleration; // without gravity, where the phone supports it
      if (!a || a.x == null) return;
      const jolt = Math.hypot(a.x, a.y, a.z);
      const now = performance.now();
      if (jolt > SHAKE.threshold && now - lastShake > SHAKE.cooldown) { lastShake = now; shatter(); }
    }
    function listenForMotion() {
      addEventListener('deviceorientation', onOrientation);
      addEventListener('devicemotion', onMotion);
    }

    // Always listen: wherever data flows without asking (Android), it just works.
    // On iOS nothing arrives until permission is granted, so motionOn stays false
    // and the long-press easter egg below stays armed.
    listenForMotion();
    const canAsk = typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function';
    if (canAsk) {
      // iOS easter egg: hold a finger down for ~1s (not on a link), let go, and iOS asks.
      let pressTimer = null, pressReady = false, pressAt = null;
      // Touch events rather than pointer events: iOS only accepts the permission
      // request from inside a genuine touchend.
      addEventListener('touchstart', (e) => {
        if (motionOn || e.touches.length > 1 || e.target.closest('a, button')) return;
        pressReady = false;
        pressAt = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        pressTimer = setTimeout(() => { pressReady = true; }, 900);
      }, { passive: true });
      const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
      addEventListener('touchcancel', cancelPress);
      // A finger that wanders more than ~12px is a drag, not a press
      addEventListener('touchmove', (e) => {
        if (!pressAt) return;
        const t = e.touches[0];
        if (Math.hypot(t.clientX - pressAt.x, t.clientY - pressAt.y) > 12) { cancelPress(); pressReady = false; pressAt = null; }
      }, { passive: true });
      addEventListener('touchend', async () => {
        cancelPress();
        if (!pressReady || motionOn) return;
        pressReady = false;
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 400);
        try {
          // Must be called straight from the finger lifting, or iOS refuses
          const [o] = await Promise.all([
            DeviceOrientationEvent.requestPermission(),
            typeof DeviceMotionEvent?.requestPermission === 'function'
              ? DeviceMotionEvent.requestPermission() : 'granted',
          ]);
          if (o === 'granted') shatter(); // a little "unlocked" moment
        } catch { /* denied or unavailable: the page just stays as it was */ }
      });
    }
    layout();
    document.fonts?.ready.then(layout); // text height settles once Inter loads
    requestAnimationFrame(frameLoop);

  </script>
</body>
</html>
